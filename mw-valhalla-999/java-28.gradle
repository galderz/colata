import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.JavaExec

def previewVersion = 28
def jdk28Home = System.getenv("JAVA_28_HOME")

// Module exports needed by annotation processors (e.g. Checker Framework)
// that access jdk.compiler internals at compile time.
// Must use -J prefix since these are JVM args passed via the javac command line.
def jdkCompilerExports = [
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
    '-J--add-exports=jdk.compiler/com.sun.tools.javac.type=ALL-UNNAMED',
    '-J--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
    '-J--enable-preview',
]

gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        // Skip build-plugin projects that use Groovy and cannot handle Java 28 class files
        if (project.path.startsWith(':local-build-plugins') || project.name == 'local-build-plugins') {
            return
        }

        project.tasks.withType(JavaCompile).configureEach {
            // Use source/target instead of release to avoid conflicts with
            // --add-exports from system modules (e.g. jdk.compiler for annotation processors)
            options.release.set(null as Integer)
            sourceCompatibility = "${previewVersion}"
            targetCompatibility = "${previewVersion}"
            options.fork = true
            options.forkOptions.javaHome = file(jdk28Home)
            // Replace existing JVM args with module exports needed by annotation processors
            options.forkOptions.jvmArgs = jdkCompilerExports.collect()
        }
    }
}